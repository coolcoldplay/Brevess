<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brevess 离线文献</title>
  <link rel="stylesheet" href="offline-reader.css">
</head>
<body>
  <header class="offline-header">
    <img src="icons/icon48.png" alt="">
    <div><strong id="offlineArticleTitle">正在载入离线文献…</strong><small id="offlineArticleStatus" role="status" aria-live="polite">仅读取本机保存的网页快照</small></div>
    <button id="offlineArticleClose" type="button">关闭</button>
  </header>
  <main class="offline-main">
    <iframe id="offlineArticleFrame" title="离线文献正文"
      sandbox="allow-popups allow-top-navigation-by-user-activation"></iframe>
  </main>
  <script src="core/i18n.js"></script>
  <script src="offline-reader.js"></script>
</body>
</html>
