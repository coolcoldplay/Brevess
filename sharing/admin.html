<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>BREVESS · 管理后台</title><link rel="stylesheet" href="sharing.css"><link rel="stylesheet" href="admin.css"></head>
<body class="sharing-page admin-page"><main class="shell">
<header><div><p class="eyebrow">BREVESS</p><h1 data-label="title"></h1></div><a href="index.html" data-label="back"></a></header>
<div class="admin-toolbar"><p class="intro" data-label="intro"></p><label><span data-label="language"></span><select id="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label></div>
<p id="status" class="message" role="status" aria-live="polite"></p>
<section id="login-card" class="card"><h2 data-label="loginTitle"></h2><p class="muted" data-label="loginHint"></p><form id="login-form"><label><span data-label="username"></span><input id="username" autocomplete="username" required maxlength="64"></label><label><span data-label="password"></span><input id="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button class="primary" data-label="login"></button></form></section>
<section id="dashboard" hidden><div class="admin-toolbar"><p id="identity"></p><div class="actions"><button id="refresh" data-label="refresh"></button><button id="logout" data-label="logout"></button></div></div>
<nav id="tabs" class="actions" aria-label="Management"><button data-tab="users" aria-pressed="true" data-label="users"></button><button data-tab="content" aria-pressed="false" data-label="content"></button><button data-tab="audit" aria-pressed="false" data-label="audit"></button></nav>
<form id="filters" class="card admin-filters"><label><span data-label="search"></span><input id="search" type="search" maxlength="200"></label><label id="author-label" hidden><span data-label="author"></span><input id="author" maxlength="200"></label><label id="group-label" hidden><span data-label="group"></span><select id="group"></select></label><label id="kind-label" hidden><span data-label="kind"></span><select id="kind"><option value="all" data-label="all"></option><option value="highlight_note" data-label="highlight_note"></option><option value="panel_note" data-label="panel_note"></option></select></label><label><span data-label="state"></span><select id="state"></select></label><label id="sort-label" hidden><span data-label="sort"></span><select id="sort"><option value="newest" data-label="newest"></option><option value="oldest" data-label="oldest"></option><option value="likes" data-label="likes"></option></select></label><button class="primary" data-label="apply"></button></form>
<p id="count" class="muted"></p><div id="results" aria-live="polite"></div><button id="more" data-label="more" hidden></button></section>
<dialog id="confirm" class="sharing-dialog"><form id="confirm-form"><h2 id="confirm-title"></h2><p id="confirm-target"></p><p class="muted" data-label="actionHint"></p><label><span data-label="reason"></span><textarea id="reason" required maxlength="500" rows="3"></textarea></label><footer><button id="cancel" type="button" data-label="cancel"></button><button class="primary" data-label="confirm"></button></footer></form></dialog>
</main><script src="../core/i18n.js"></script><script src="client.js"></script><script src="admin.js"></script></body></html>
