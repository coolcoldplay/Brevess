<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BREVESS · 课题工作台</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23252525'/%3E%3Ctext x='3' y='13' fill='%23f2d24b' font-size='12' font-family='Arial' font-weight='bold'%3EB%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css"></head>
<body>
  <header class="brandbar"><a class="brand" href="../options.html" target="_blank">BREVESS</a><span class="crumb">课题工作台</span><span id="save-status" role="status">正在读取本机课题…</span><button data-action="sync" title="查看保存及目录同步状态">保存状态</button><a href="../workbench/index.html" target="_blank" title="在完整标签页打开">↗</a><button data-action="external-agent" title="外部 Agent 连接、write scope 与审计">Agent 连接</button><button data-action="help">帮助</button></header>
  <div class="workspacebar"><select id="project-select" aria-label="当前课题"></select><details class="menu"><summary>文件</summary><div><button data-action="new-project">新建课题</button><button data-action="import">导入课题 JSON</button><button data-action="export">完整导出</button><button data-action="share-export-hypothesis">导出选中假说</button><button data-action="share-export-plan">导出选中方案</button><button data-action="share-export-bundle">打包所选</button><button data-action="import-share">导入分享文件</button><button data-action="library-radar-export">导出文献雷达</button><button data-action="library-radar-import">导入文献雷达</button><button data-action="library-global-export">导出文献总库</button><button data-action="library-global-import">导入文献总库</button><button data-action="demo">导入演示课题</button><button data-action="recycle">回收站</button></div></details><div class="mode-switch"><button data-action="mode-radar">文献雷达</button><button data-action="mode-library">文献总库</button><button data-action="mode-hypothesis">假说梳理</button><button data-action="mode-figure">组图规划</button></div><div class="history"><button data-action="undo" aria-label="撤销" title="撤销 Ctrl+Z">↶</button><button data-action="redo" aria-label="重做" title="重做 Ctrl+Shift+Z">↷</button></div></div>
  <div id="conflict" hidden></div>
  <main id="workbench"><aside id="directory"><div class="pane-title"><strong>课题目录</strong><button data-action="collapse-left" title="收起 / 展开目录">«</button></div><div id="tree"></div></aside><div id="left-split" class="split" role="separator" aria-label="调整目录宽度"></div>
    <section id="center"><div id="contextbar"></div><section id="radar-view" hidden><iframe id="literature-radar-frame" title="文献雷达"></iframe></section><section id="library-view" hidden><div class="library-view-head"><div><p class="eyebrow">GLOBAL SAVED LITERATURE</p><h1>文献总库</h1><p class="muted">全局知识库；已读雷达文献以只读元数据合并，提取与引用在课题材料库中完成。</p></div><button data-action="library-to-material">去假说材料库</button></div><div class="library-view-tools"><label class="searchbox"><span>⌕</span><input id="library-view-query" type="search" placeholder="搜索标题、作者、期刊或摘要" aria-label="搜索文献总库"><button data-action="library-view-search">搜索</button></label><div class="library-view-filters"><select id="library-view-scope" aria-label="文献范围"><option value="all">全部文献</option><option value="radar">雷达已读</option><option value="local">有本地条目</option><option value="metadata-only">仅雷达元数据</option><option value="partial">部分离线</option><option value="missing">无本地全文</option></select><select id="library-view-sort" aria-label="排序"><option value="saved">最近保存 / 发现</option><option value="title">标题</option><option value="year">发表年份</option></select></div></div><div id="library-view-list" class="library-view-list"></div></section><section id="canvas-shell"><nav id="tool-rail" aria-label="画布工具"></nav><div id="stage" tabindex="0" aria-label="工作台画布"></div><div id="viewport-controls"><button data-action="zoom-out" title="缩小">−</button><span id="zoom-label">100%</span><button data-action="zoom-in" title="放大">＋</button><button data-action="fit">适应</button></div><div id="presentation-controls" hidden><button data-action="exit-presentation">退出演示 · Esc</button></div><div id="drop-hint" hidden></div><div id="gesture-hint">拖动对象 · 空白拖动平移 · 滚轮缩放 · Shift 框选</div></section><div id="figure-split" class="split horizontal" role="separator" aria-label="调整 Figure 缩略条高度"></div><div id="story-strip"></div></section>
    <div id="right-split" class="split" role="separator" aria-label="调整资源区宽度"></div><aside id="right"><section id="library-detail" hidden></section><section id="library"><div class="pane-title"><button type="button" class="pane-toggle" data-action="collapse-library" aria-expanded="true" aria-controls="library-content" title="收起文献与素材"><svg class="pane-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 9 5 5 5-5"/></svg><strong>材料库</strong></button><button data-action="upload">＋ 自有图片</button></div><div id="library-content" class="pane-content"><div class="library-tools"><select id="material-source" aria-label="材料来源"><option value="library">来源一 · 全局文献总库</option><option value="plan">来源二 · 组图规划证据</option></select><select id="library-mode" aria-label="资源范围"><option value="library">已保存文库</option><option value="used">本课题来源</option><option value="assets">自有素材</option></select><input id="library-search" type="search" placeholder="搜索材料" aria-label="搜索文献与素材"><button data-action="search">搜索</button></div><div id="source-tabs"></div><p class="material-drag-hint">按论文 → Figure → Panel 下钻；拖到左侧节点或联系</p><div id="resource-list"></div></div></section><div id="property-split" class="split horizontal" role="separator" aria-label="调整素材与属性高度"></div><section id="inspector"><div class="pane-title"><button type="button" class="pane-toggle" data-action="collapse-inspector" aria-expanded="true" aria-controls="properties" title="收起属性"><svg class="pane-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 9 5 5 5-5"/></svg><strong>属性</strong></button><span id="selection-count"></span></div><div id="properties"></div></section></aside>
  </main>
  <footer><span id="context-status">本机课题 · 初始为空</span><button type="button" id="agent-status" data-action="agent">Agent 尚未连接</button></footer><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog><section id="agent-panel" class="agent-panel" hidden aria-label="本地 Agent"></section><input id="import-input" type="file" accept="application/json,.json" hidden><input id="share-import-input" type="file" accept="application/json,.json" hidden><input id="library-transfer-input" type="file" accept="application/json,.json" hidden><input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" multiple hidden>
  <script src="../core/research-workbench-group-table.js"></script><script src="../core/research-workbench-model.js"></script><script src="../core/research-workbench-store.js"></script><script src="../core/research-workbench-prototype-catalog.js"></script><script src="../core/research-workbench-import-export.js"></script><script src="operation-registry.js"></script><script src="global-library.js"></script><script src="library-import-store.js"></script>
  <script src="../core/evidence-first-mechanism.js"></script><script src="../core/figure-result-binding.js"></script><script src="../core/mechanism-canvas-model.js"></script><script src="../core/figure-workspace.js"></script><script src="../core/research-workbench-resources.js"></script>
  <script src="../core/research-workbench-canvas-interaction.js"></script><script src="ui-interactions.js"></script><script src="model.js"></script><script src="controls.js"></script><script src="routing.js"></script><script src="session.js"></script><script src="../core/runtime-workbench-bridge.js"></script><script src="../core/codex-native-client.js"></script><script src="../core/harness-native-client.js"></script><script src="agent-tools.js"></script><script src="../core/local-library-tags.js"></script><script src="agent-local-data.js"></script><script src="../core/literature-radar-model.js"></script><script src="../core/literature-radar-store.js"></script><script src="../core/literature-radar-pubmed.js"></script><script src="../core/literature-radar-service.js"></script><script src="../core/literature-radar-agent-tools.js"></script><script src="agent-runner.js"></script><script src="agent-panel.js"></script><script src="app.js"></script><script src="mcp-host.js"></script><script src="library-events.js"></script><script src="mcp-bridge.js"></script>
  <script src="../core/library-transfer.js"></script>
  <script src="../core/literature-radar-transfer.js"></script>
  <script src="global-library-transfer.js"></script>
  <script src="share.js"></script>
</body></html>
